name: Invoice AI CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

defaults:
  run:
    working-directory: .

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoiceai
          POSTGRES_PASSWORD: invoiceai_dev_password
          POSTGRES_DB: invoice_ai
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U invoiceai -d invoice_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://invoiceai:invoiceai_dev_password@localhost:5436/invoice_ai
      SECRET_KEY: test-secret-key-invoice-ai-m1-32b
      APP_ENV: test
      AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + migrate + seed
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed
      - name: Pytest
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
